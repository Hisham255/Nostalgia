<!DOCTYPE html>

          <button id="menu_btn" aria-label="Toggle menu"
            class="md:hidden text-white/70 hover:text-[var(--primary)] transition-colors w-9 h-9 flex items-center justify-center rounded-lg">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>

        </div>

        <i class="fa-solid fa-chevron-down text-[var(--primary)] text-xs animate-bounce"></i>
